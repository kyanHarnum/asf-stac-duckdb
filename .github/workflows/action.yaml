name: workflow ingestion
on:
  workflow_dispatch:
    inputs:
      collection:
        description: 'Collection name'
        required: true
        type: string
permissions:
  id-token: write
  contents: write
env:
  DATA_BUCKET: asf-stac-duckdb
  DATA_REGION: us-west-2
  DATA_PIPELINE_ROLE: arn:aws:iam::577391712883:role/aws-sam-cli-managed-asf-stac--PipelineExecutionRole-ESPP2g3IJ3tl
jobs:
  ingest-and-convert:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-full-3.12.1
    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.DATA_PIPELINE_ROLE }}
          aws-region: ${{ env.DATA_REGION }}

      - name: setup git/make
        run: |
          apt-get update && apt-get install -y git make

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run ingest pipeline
        run: | 
          make ingest COLLECTION=${{ github.event.inputs.collection }}