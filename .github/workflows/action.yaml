name: workflow ingestion
on:
  workflow_dispatch:
    inputs:
      collection:
        description: 'Collection name'
        required: true
        type: string
permissions:
  id-token: write
  contents: write

env:
  DATA_BUCKET: asf-stac-duckdb
  DATA_REGION: us-west-2
  DATA_PIPELINE_ROLE: arn:aws:iam::577391712883:role/aws-sam-cli-managed-asf-stac--PipelineExecutionRole-ESPP2g3IJ3tl

jobs:
  ingest-and-convert:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-full-latest
    steps:

      - uses: actions/checkout@v3
      - name: Set up conda env
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: asf-stac
          python-version: 3.9

      - name: Run ingest pipeline
        run: |
          make ingest COLLECTION=${{ github.event.inputs.collection }}
